<!doctype html>
<!--
  The reply form as linux.sb serves it to a signed-in reader of /topic/<id>,
  copied verbatim (only _csrf and the uid in the editor's draft key are
  replaced). This is the markup that settles what a reply actually posts:

    action="/reply_edit"        - NOT /topic/<id>
    name="body"                 - NOT "content"
    _csrf + topic_id            - the only other fields

  Posting `content` to /topic/<id> - which is what the app did before - never
  reaches the reply handler at all: the site just re-renders the topic page, and
  a 200 full of HTML looks enough like success to be reported as one.

  There is no .cf-turnstile here, so a reply can be posted natively. Keep that
  in mind if the site ever adds one: the form would have to go to a WebView.
-->
