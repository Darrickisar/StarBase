<!doctype html>
<!--
  GET /direct_messages - the conversation list. Structure verbatim; the display
  names and the message previews are real people's, so those are replaced.

  This fixture exists because the list parser was looking for `.dm-item`,
  `.dm-preview`, `.dm-time` and four more classes that do not appear anywhere on
  the real page - the site calls these `.direct-messages-conversation` and friends.
  Every signed-in user with private messages saw an empty 私信 screen.

  Note the partner's user id is on the avatar as `data-online-user-id`; the row
  links to the thread, not to a profile, so there is no /user/<id> href to read.
-->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>私信 - LINUX SB</title></head>
<body>
